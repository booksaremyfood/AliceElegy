{id:"TOP_01",short:"Absentia",nome:"Distance from the beloved / Absentia",cl:"An obstacle to the fulfilment of love, a cause of lament and of a sense of incompleteness (two severed halves).",vf:"Becomes the guiding motif of epistolary friendship. Geographical separation concerns bodies but not souls (absentem uidet)."},
{id:"TOP_02",short:"Hostile / allied nature",nome:"Hostile Nature vs. Allied Nature",cl:"Seas, rivers and storms act as enemies and obstacles placed between lovers (e.g. Hero and Leander).",vf:"Winds and waves become messengers and carriers of memory. The stormy sea symbolises the blanda tempestas of spiritual affection."},
{id:"TOP_03",short:"Absens absentem uidet",nome:"Spiritual vision of the absent one / Absens absentem uidet",cl:"The illusion or madness of passion: the lover hears and sees the beloved even in her absence or in dreams.",vf:"The constant presence of the friend in the mind (honestus amor) or communion in dreams (unianimes quies)."},
{id:"TOP_04",short:"Eyes and gaze",nome:"Eyes and Gaze (Oculi / Lumina / Vultus)",cl:"The beloved’s sight and eyes are the primary channel through which passion strikes (Cynthia prima…).",vf:"The friend’s departure deprives the author of sight (lumina rapuisti); his return restores vital light and spiritual joy."},

{id:"TOP_06",short:"Desidia vs. Labor",nome:"Desidia vs. the Labor of Love",cl:"Elegiac love is a form of activity and discipline, opposed to profane inertia (desidia).",vf:"A friend’s silence or lack of reply is read as desidia, a deliberate choice that breaks affective communion."},

function runSearch(){
  const q=norm($("#sq").value.trim()),d=$("#sd").value,k=$("#sk").value;
  const hit=o=>{const c=C(o.c);

    if(!q)return true;
    const hay=norm([o.id,o.ref,o.v.join(" "),o.lex.join(" "),o.f,c.titolo,c.dest,c.ref,o.t.map(t=>T(t).nome+T(t).vf).join(" "),o.m.map(m=>M(m).a+" "+M(m).op+" "+M(m).q).join(" ")].join(" "));
    return q.split(/\s+/).every(w=>hay.includes(w));};
  const r=DB.occ.filter(hit);
  let extra="";
  if(q&&!d&&!k){
    const tt=DB.topoi.filter(t=>norm(t.nome+t.cl+t.vf).includes(q)), mm=DB.mod.filter(m=>norm(m.a+m.op+m.q+m.r).includes(q));

  $("#res").innerHTML=r.map(occCard).join("")+extra;
}

function graph(){
  const svg=$("#graph");if(!svg)return;const W=1000,H=640,ns="http://www.w3.org/2000/svg";
  const nodes=[],links=[],idx={};
  const add=(id,label,type,href)=>{idx[id]=nodes.length;nodes.push({id,label,type,href,x:W/2+(Math.random()-.5)*300,y:H/2+(Math.random()-.5)*300,vx:0,vy:0})};
  authors.forEach(a=>add("A:"+a,a,"a","#/fonti/"+DB.mod.find(m=>m.a===a).id));
  DB.topoi.forEach(t=>add(t.id,t.short,"t","#/topos/"+t.id));
  DB.carmi.forEach(c=>add(c.id,c.ref,"c","#/carmi/"+DB.occ.find(o=>o.c===c.id).id));
  const seen=new Set(),L=(a,b)=>{const k=a+b;if(!seen.has(k)){seen.add(k);links.push({s:idx[a],t:idx[b]})}};
  DB.occ.forEach(o=>o.t.forEach(t=>{L(o.c,t);o.m.forEach(m=>L("A:"+M(m).a,t))}));
  DB.extraTM.forEach(([t,m])=>L("A:"+M(m).a,t));
  const lg=document.createElementNS(ns,"g");svg.appendChild(lg);
  const le=links.map(()=>{const e=document.createElementNS(ns,"line");e.setAttribute("class","glink");lg.appendChild(e);return e});
  const col={a:"#9A6B2F",t:"#1E293B",c:"#5B7B6F"};
  let alpha=1;const ge=[];
  nodes.forEach(n=>{
    const g=document.createElementNS(ns,"g");g.setAttribute("class","gnode");g.setAttribute("tabindex","0");g.setAttribute("role","link");g.setAttribute("aria-label",n.label);
    const sh=n.type==="c"?document.createElementNS(ns,"rect"):document.createElementNS(ns,"circle");
    if(n.type==="c"){sh.setAttribute("width",22);sh.setAttribute("height",22);sh.setAttribute("x",-11);sh.setAttribute("y",-11);sh.setAttribute("rx",3)}else sh.setAttribute("r",n.type==="a"?15:9);
    sh.setAttribute("fill",col[n.type]);sh.setAttribute("stroke","#fff");sh.setAttribute("stroke-width",2);
    const tx=document.createElementNS(ns,"text");tx.textContent=n.label;tx.setAttribute("y",n.type==="a"?-21:-15);tx.setAttribute("text-anchor","middle");if(n.type==="a")tx.style.fontWeight="700";
    g.append(sh,tx);svg.appendChild(g);ge.push(g);
    const hi=on=>{const nb=new Set([n.id]);links.forEach((l,i)=>{const h=on&&(nodes[l.s]===n||nodes[l.t]===n);if(h){nb.add(nodes[l.s].id);nb.add(nodes[l.t].id)}le[i].classList.toggle("hi",h);le[i].classList.toggle("dim",on&&!h)});ge.forEach((e,i)=>e.classList.toggle("dim",on&&!nb.has(nodes[i].id)))};
    g.addEventListener("mouseenter",()=>hi(true));g.addEventListener("mouseleave",()=>hi(false));g.addEventListener("focus",()=>hi(true));g.addEventListener("blur",()=>hi(false));
    g.addEventListener("keydown",e=>{if(e.key==="Enter")location.hash=n.href});
    let drag=false,moved=false;
    g.addEventListener("pointerdown",e=>{drag=true;moved=false;g.setPointerCapture(e.pointerId)});
    g.addEventListener("pointermove",e=>{if(!drag)return;moved=true;const r=svg.getBoundingClientRect();n.x=(e.clientX-r.left)*W/r.width;n.y=(e.clientY-r.top)*H/r.height;n.vx=n.vy=0;alpha=.4});
    g.addEventListener("pointerup",()=>{drag=false;if(!moved)location.hash=n.href});
  });
  function tick(){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=2600/d2*alpha;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
    links.forEach(l=>{const a=nodes[l.s],b=nodes[l.t];let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-110)*.02*alpha;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f});
    nodes.forEach(n=>{const k=n.type==="a"?.012:n.type==="t"?.004:.018;n.vx+=(W/2-n.x)*k*alpha;n.vy+=(H/2-n.y)*k*alpha;n.vx*=.8;n.vy*=.8;n.x=Math.max(50,Math.min(W-50,n.x+n.vx));n.y=Math.max(40,Math.min(H-30,n.y+n.vy))});
    nodes.forEach((n,i)=>ge[i].setAttribute("transform",`translate(${n.x},${n.y})`));
    links.forEach((l,i)=>{le[i].setAttribute("x1",nodes[l.s].x);le[i].setAttribute("y1",nodes[l.s].y);le[i].setAttribute("x2",nodes[l.t].x);le[i].setAttribute("y2",nodes[l.t].y)});
    alpha*=.985;
  }
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){for(let i=0;i<350;i++)tick();alpha=0;tick()}
  (function loop(){if(!document.body.contains(svg))return;if(alpha>.01)tick();requestAnimationFrame(loop)})();
}

const app=$("#app");
function route(){
  const parts=location.hash.replace(/^#\/?/,"").split("/"),R=parts[0]||"home",arg=decodeURIComponent(parts[1]||""),raw=parts.slice(1).join("/");
  let out;
  if(R==="home")out=home();else if(R==="topoi")out=topoi();else if(R==="topos")out=topos(arg);
  else if(R==="carmi")out=carmi(arg);else if(R==="fonti")out=fonti(arg);else if(R==="cerca")out=cerca(raw);else if(R==="export")out=exportView();else out=notfound();
  app.innerHTML=out;
  $$("nav.main a").forEach(a=>a.removeAttribute("aria-current"));
  const key=R==="topos"?"topoi":R;const cur=$(`nav.main a[data-r="${key}"]`);if(cur)cur.setAttribute("aria-current","page");
  scrollTo(0,0);app.focus({preventScroll:true});
  if(R==="home"){graph();$$(".counter b").forEach(b=>{const n=+b.dataset.n;let i=0;const s=setInterval(()=>{b.textContent=++i;if(i>=n)clearInterval(s)},60)})}
  if(R==="cerca")runSearch();
}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-carme]");if(t){const c=t.dataset.carme;location.hash="#/carmi/"+DB.occ.find(o=>o.c===c).id;return}
  const v=e.target.closest(".verse");if(v){const o=O(v.dataset.occ);$$(".verse").forEach(x=>{x.setAttribute("aria-pressed",x===v);x.querySelector(".hint").textContent=x===v?HINT_ON:HINT_OFF});$(".side").innerHTML=side(o);return}
  const ch=e.target.closest(".chip[data-a]");if(ch){$$(".chip[data-a]").forEach(x=>x.setAttribute("aria-pressed",x===ch));$$("#mb tr").forEach(r=>r.hidden=ch.dataset.a&&r.dataset.a!==ch.dataset.a);return}
  const cc=e.target.closest(".chip[data-c]");if(cc){$$(".chip[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===cc));$$("#occlist .occ").forEach(r=>r.hidden=cc.dataset.c&&r.dataset.c!==cc.dataset.c);return}
  const x=e.target.closest("[data-x]");if(x)return doExport(x.dataset.x);
  if(e.target.id==="sr"){$("#sq").value="";$("#sd").value="";$("#sk").value="";runSearch()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="tf"){const q=norm(e.target.value);$$("#tg .card").forEach(c=>c.hidden=!c.dataset.s.includes(q))}
  if(e.target.id==="sq")runSearch();
});
document.addEventListener("change",e=>{if(e.target.id==="sd"||e.target.id==="sk")runSearch()});

const tip=$("#tooltip");
function showTip(el){tip.innerHTML=`<b>${el.dataset.t}</b>${el.dataset.tip}`;tip.style.display="block";const r=el.getBoundingClientRect();let y=r.bottom+8;if(y+tip.offsetHeight>innerHeight)y=r.top-tip.offsetHeight-8;tip.style.left=Math.max(8,Math.min(r.left,innerWidth-340))+"px";tip.style.top=y+"px"}
document.addEventListener("mouseover",e=>{const t=e.target.closest(".tip");if(t)showTip(t)});
document.addEventListener("mouseout",e=>{if(e.target.closest(".tip"))tip.style.display="none"});
document.addEventListener("focusin",e=>{const t=e.target.closest(".tip");if(t)showTip(t)});
document.addEventListener("focusout",()=>tip.style.display="none");
document.addEventListener("keydown",e=>{if(e.key==="Escape")tip.style.display="none"});
route();
</script>
